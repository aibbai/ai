<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        let sum = 0;
        let cnt = 0;
        let o = 0;
        let x = 0;

        while (confirm('누적할래?')){
            cnt++;
            score = prompt("누적할 점수?");}
       

        document.write(cnt + '번 입력'+ '<br>'); 

        if(score >= 0 && score <= 100) {sum += score; o++;} {
            document.write('누적점수 : ' ,sum += score + '<br>'); 
            document.write('점수를 제대로 입력한 횟수 : ', o + '<br>');
        }else{x++;}{
            document.write('점수를 잘못 입력한 횟수 : ', x);
        } 

   
    </script>
</head>

</body>
</html>
