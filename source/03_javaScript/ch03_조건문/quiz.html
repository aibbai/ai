<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <style>
    p, h3{text-align: center;}
  </style>
  <script>
    function chk(){
      // 첫번째 수(frm.su1.value)와 두번째 수를 가져와서 몇번째 수가 얼마 더큰지 alert      
      if(!frm.su1.value){
        alert('첫번째 수를 입력하세요');
        frm.su1.focus();
        return false;
      }else if(!frm.su2.value){
        alert('두번째 수를 입력하세요');
        frm.su2.focus();
        return false;
      }
      // 몇번째 수가 얼마나 더 큰지
      let su1 = parseInt(frm.su1.value);
      let su2 = parseInt(frm.su2.value);
      let msg = (su1>su2)? `첫번째 수가 ${su1-su2}만큼 더 크다` : 
              (su2>su1)? `두번째 수가 ${su2-su1}만큼 더 크다` : '두 수는 같다';
      alert(msg);
      document.body.innerHTML += `<h3>${msg}</h3>`;
      frm.su1.value = su1;
      frm.su2.value = su2;
      return false;
    }
  </script>
</head>
<body>
  <form name="frm" onsubmit="return chk()">
    <fieldset>
      <p>첫번째 수 : <input type="number" name="su1"></p>
      <p>두번째 수 : <input type="number" name="su2"></p>
      <p><input type="submit"></p>
    </fieldset>
  </form>
</body>
</html>
